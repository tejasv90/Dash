<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Dashboards by Tejas</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- iPhone Home Screen icon -->
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="/apple-touch-icon.png">

    <!-- Standard favicon -->
    <link rel="icon"
          type="image/png"
          href="/apple-touch-icon.png">

    <!-- Web App Manifest -->
    <link rel="manifest"
          href="/manifest.json">

    <!-- iOS Web App -->
    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <meta name="apple-mobile-web-app-status-bar-style"
          content="default">

    <meta name="apple-mobile-web-app-title"
          content="Dashboards">

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: white;
            font-family: Arial, sans-serif;
        }

        .container {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border-radius: 25px;
        }

        h1 {
            font-size: 22px;
            margin-top: 20px;
        }

        p {
            color: #666;
        }

    </style>

</head>

<body>

    <div class="container">

        <img src="/apple-touch-icon.png"
             alt="Dashboards by Tejas">

        <h1>Dashboards by Tejas</h1>

        <p>Tap below to open the dashboard.</p>

        <a href="https://sites.google.com/view/dashboardsbytejas/dash">

        </a>
